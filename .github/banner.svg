<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="hermes-ha-app — un agente AI dentro Home Assistant, senza abbassare le difese">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#0b1a26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41BDF5"/>
      <stop offset="100%" stop-color="#7C6CF0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#41BDF5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#41BDF5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8B949E" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>
  <ellipse cx="1065" cy="180" rx="270" ry="230" fill="url(#glow)"/>

  <!-- blocco testuale -->
  <g font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif">
    <text x="88" y="138" font-size="66" font-weight="700" fill="#E6EDF3" letter-spacing="-1.2">Hermes Agent</text>
    <text x="88" y="180" font-size="21" font-weight="600" fill="#41BDF5" letter-spacing="0.6">add-on per Home Assistant OS</text>
    <rect x="90" y="204" width="108" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="88" y="252" font-size="25" font-weight="400" fill="#9BA7B4">Un agente AI dentro Home Assistant,</text>
    <text x="88" y="285" font-size="25" font-weight="400" fill="#9BA7B4">senza abbassare le difese.</text>
    <text x="90" y="318" font-size="14.5" font-weight="600" fill="#61707F" letter-spacing="2.4">
      INGRESS &#160;·&#160; NON PRIVILEGIATO &#160;·&#160; IMMAGINE IMMUTABILE &#160;·&#160; MIT
    </text>
  </g>

  <!-- scudo + casa + nodi dell'agente -->
  <g transform="translate(1065 180)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 -118 L 96 -82 L 96 12 C 96 74 50 112 0 128 C -50 112 -96 74 -96 12 L -96 -82 Z"
          stroke="#41BDF5" stroke-opacity="0.45" stroke-width="2.5"/>
    <path d="M 0 -96 L 78 -67 L 78 8 C 78 60 42 92 0 106 C -42 92 -78 60 -78 8 L -78 -67 Z"
          fill="#41BDF5" fill-opacity="0.045" stroke="none"/>

    <!-- casa -->
    <path d="M -46 -12 L 0 -52 L 46 -12" stroke="#E6EDF3" stroke-opacity="0.85" stroke-width="3.5"/>
    <path d="M -34 -12 L -34 46 L 34 46 L 34 -12" stroke="#E6EDF3" stroke-opacity="0.85" stroke-width="3.5"/>

    <!-- nodi: l'agente dentro la casa -->
    <path d="M -16 22 L 0 4 L 16 22" stroke="url(#accent)" stroke-width="2.6" stroke-opacity="0.95"/>
    <circle cx="0" cy="4" r="6.5" fill="#41BDF5" stroke="none"/>
    <circle cx="-16" cy="22" r="4.5" fill="#7C6CF0" stroke="none"/>
    <circle cx="16" cy="22" r="4.5" fill="#7C6CF0" stroke="none"/>
  </g>
</svg>
