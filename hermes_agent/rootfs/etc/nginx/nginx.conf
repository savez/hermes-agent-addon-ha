# nginx davanti alla dashboard, raggiungibile solo dal Supervisor (Ingress).
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 50m;

    # Access log senza il prefisso di Ingress: quel prefisso contiene il
    # token di sessione, che non deve finire nel log dell'add-on (i log sono
    # visibili nell'interfaccia di Home Assistant e finiscono nei bug report).
    # Registriamo solo metodo, esito e dimensione, che bastano a capire se
    # una richiesta è arrivata e com'è andata.
    log_format ingress_min '$time_iso8601 $request_method $status $body_bytes_sent';
    access_log /dev/stdout ingress_min;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099 default_server;

        # 172.30.32.2 = Supervisor: da lì arrivano sia Ingress sia il watchdog.
        # Gli altri container della rete interna di HA vengono rifiutati.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        # NOTA per chi legge: qui NON serve riscrivere il path per togliere
        # il prefisso /api/hassio_ingress/<token>. Il Supervisor lo toglie
        # già da solo e passa il prefisso soltanto nell'header
        # X-Ingress-Path (verificato confrontando il path in arrivo con
        # quello riscritto su un impianto reale). Una versione precedente
        # aveva un `rewrite` difensivo per l'ipotesi opposta: non è mai
        # scattato, ed è stato rimosso. Se vedi 404 sulle pagine interne
        # della dashboard, la causa è il base path degli asset compilati
        # (vedi patches/vite-base-path-runtime.snippet), non il path della
        # richiesta.

        # Due endpoint della dashboard di Hermes installano dipendenze a
        # runtime (shell/npm) senza controllare HERMES_DISABLE_LAZY_INSTALLS:
        # con l'immagine immutabile di questo add-on i provider di memoria
        # cloud esterni e il bridge WhatsApp non sono quindi configurabili.
        # Bloccati qui, senza modificare il codice di hermes-agent.
        location ~ ^/api/memory/providers/[^/]+/setup$ {
            return 403;
        }
        location = /api/messaging/whatsapp/onboarding/start {
            return 403;
        }

        location / {
            proxy_pass http://127.0.0.1:8788;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # La dashboard rifiuta ogni richiesta il cui Host non combaci
            # con l'interfaccia su cui è in ascolto (protezione anti-DNS-
            # rebinding, indipendente dal login — bind sempre 127.0.0.1
            # internamente). Il client reale arriva con l'host di HA (es.
            # <ip-di-home-assistant>:8123): serve un Host letterale, genuinamente
            # loopback, verso l'upstream.
            proxy_set_header Host 127.0.0.1:8788;

            # Stesso motivo dell'Host sopra, ma per i WebSocket (pty del
            # terminale, sidecar JSON-RPC di Chat, feed eventi del pannello
            # laterale): la dashboard ripete un controllo anti-DNS-rebinding
            # sull'header Origin apposta per le rotte WebSocket (l'HTTP
            # middleware che gestisce Host non gira su di loro). Il browser
            # manda l'Origin reale (es. http://<ip-di-home-assistant>:8123), che non
            # combacia con l'interfaccia di bind — verificato in un caso
            # reale sul Pi: log "pty refused: origin_mismatch
            # origin=http://<ip-di-home-assistant>:8123 bound=127.0.0.1" per ogni
            # tentativo di connessione, e "sidecar connect failed" /
            # "Reconnect side panel" lato browser per lo stesso motivo.
            proxy_set_header Origin http://127.0.0.1:8788;

            # La dashboard prefissa i suoi redirect (es. verso /login) e il
            # base path della SPA (__HERMES_BASE_PATH__) leggendo l'header
            # standard X-Forwarded-Prefix — ma il Supervisor di HA manda
            # invece X-Ingress-Path (header proprietario). Senza questa
            # traduzione, i redirect e i link interni uscirebbero senza
            # prefisso, portando il browser fuori dal proxy di Ingress.
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;

            # Streaming delle risposte dell'agente (SSE): niente buffering.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            # La dashboard nativa di Hermes non manda X-Frame-Options né una
            # CSP con frame-ancestors (verificato in T6): non c'è nulla da
            # togliere per l'iframe di HA. Lo teniamo comunque come no-op
            # difensivo, nel caso una futura versione lo aggiunga.
            proxy_hide_header X-Frame-Options;
        }
    }
}
